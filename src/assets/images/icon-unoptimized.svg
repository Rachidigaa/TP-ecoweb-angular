<?xml version="1.0" encoding="UTF-8"?>
<!--
  Exemple d'un SVG non optimisé :
  - commentaires, métadonnées, groupes inutiles
  - attributs redondants et transformations non nécessaires
  - large use of <defs> with unused elements
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:lang="fr" width="64" height="64" viewBox="0 0 64 64">
  <title>Icône d'exemple (non optimisé)</title>
  <desc>Icône créée dans un éditeur graphique ; contient des métadonnées et des couches</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description rdf:about="">
        <dc:format xmlns:dc="http://purl.org/dc/elements/1.1/">image/svg+xml</dc:format>
        <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">Designer</dc:creator>
        <dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">2025-01-01</dc:date>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <!-- defs with unused gradient and clipPath -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="64" height="64" />
    </clipPath>
  </defs>

  <!-- many nested groups and redundant attributes -->
  <g id="layer1" transform="translate(0,0)" fill="none" stroke="none">
    <g id="layer2" style="opacity:1;" transform="translate(0,0)">
      <!-- circle with redundant attributes -->
      <g id="circle-group">
        <circle id="outer" cx="32" cy="32" r="30" fill="#eeeeee" stroke="#cccccc" stroke-width="2" />
        <!-- unnecessary invisible rect -->
        <rect x="0" y="0" width="64" height="64" fill="none" stroke="none" />
      </g>

      <!-- plus de chemins inutiles et comments -->
      <g id="plus" transform="translate(0,0)">
        <!-- vertical bar -->
        <rect x="30" y="18" width="4" height="28" fill="#333333" />
        <!-- horizontal bar -->
        <rect x="18" y="30" width="28" height="4" fill="#333333" />
      </g>

      <!-- repeated comments and whitespace to increase size -->
      <!-- Auteur: Designer -->

    </g>
  </g>

</svg>